name: "Continuous Integration"

on:
    pull_request:
    push:
        branches:
            - '[0-9]+.[0-9]+.x'
        tags:

jobs:
    matrix:
        name: Generate job matrix
        runs-on: ubuntu-latest
        permissions:
            checks: write # Creates checks
            contents: read
        outputs:
            matrix: ${{ steps.matrix.outputs.matrix }}
        steps:
            - name: Gather CI configuration
              id: matrix
              uses: laminas/laminas-ci-matrix-action@fd1e60db9fc0f385775d91a73ea7410bcc7b2e70 # v1.35

    qa:
        name: QA Checks
        needs: [matrix]
        runs-on: ${{ matrix.operatingSystem }}
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
        steps:
            - name: ${{ matrix.name }}
              uses: laminas/laminas-continuous-integration-action@757a62736b25b11240101d3c616fff4cbc707cfd # 1.46.0
              with:
                  job: ${{ matrix.job }}

    infection:
        name: Mutation Tests
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: 8.4
                  extensions: xdebug
                  coverage: xdebug
            - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
            - run: vendor/bin/infection
